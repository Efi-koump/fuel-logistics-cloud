apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: thingsboard-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: "microk8s-hostpath"
